name: ci
# Build and test on every push and pull request. The Windows job is informational: the Windows code
# was written without ever being run on Windows, so a failure there is a lead to follow, not a block.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release
  # Known security problems in the libraries the bot uses (RustSec advisory database). Reviewed exceptions, each with
  # its reason, are in .cargo/audit.toml. Also runs once a week, because new advisories appear without any push.
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Tests
        run: cargo test --release
