<html lang="en"><head><meta charset="utf-8">

<style>

.pill.ok{border-color:var(--ok);color:var(--ok)}.pill.bad{border-color:var(--bad);color:var(--bad)}.pill.warn{border-color:var(--warn);color:var(--warn)}

nav button.on{color:var(--text);border-color:var(--acc)}main{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:15px}.card h3{margin:14px 0 6px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>.f{flex:1;min-width:180px}.f{margin-bottom:10px}.f label{display:block;color:var(--dim);font-size:12px;margin-bottom:3px}
input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;font:inherit}
input[type=checkbox]{width:auto;margin-right:6px}textarea{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
button.b{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font:inherit}
button.b.sec{background:var(--panel2);border:1px solid var(--line);color:var(--text)}button.b.red{background:var(--bad)}button.b:disabled{opacity:.5;cursor:default}
.hint{color:var(--dim);font-size:12px;margin-top:3px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px}.check{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
.check b{min-width:130px}.check .st{min-width:70px;font-weight:600}.st.ok{color:var(--ok)}.st.info{color:var(--dim)}.st.problem{color:var(--bad)}
.check pre{margin:2px 0;white-space:pre-wrap;font-size:12px;color:var(--dim)}.fix{color:var(--warn);font-size:12px}
.steps{list-style:none;padding:0;margin:0}.steps li{display:flex;gap:10px;align-items:center;padding:7px 0}.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none}
.dot.done{background:var(--ok);border-color:var(--ok)}pre.log{background:#0a0b0f;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:60vh;overflow:auto;font-size:12px;white-space:pre-wrap}
.login{max-width:380px;margin:12vh auto}.toast{position:fixed;right:18px;bottom:18px;background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;max-width:420px;z-index:9}
.toast.bad{border-color:var(--bad)}.toast.ok{border-color:var(--ok)}.muted{color:var(--dim)}.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}details{margin:8px 0}summary{cursor:pointer;color:var(--dim)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}

.modal h2{margin:0 0 8px;font-size:15px}.flist{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel2);min-height:200px;flex:1}
.frow{display:flex;gap:10px;padding:6px 10px;cursor:pointer;border-bottom:1px solid var(--line);align-items:center}.frow:hover{background:#262a3d}
.frow.sel{background:#2b3160;outline:1px solid var(--acc)}.frow.dim{opacity:.45;cursor:default}.frow .n{flex:1;word-break:break-all}.frow .sz{color:var(--dim);font-size:12px}
.pick{display:flex;gap:8px}.pick input{flex:1}.pick button{flex:none}
.embedprev{background:#2b2d31;border-left:4px solid var(--acc);border-radius:4px;padding:10px 12px;max-width:460px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;color:#dbdee1}
.embedprev .au{grid-column:1;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}.embedprev .au img{width:20px;height:20px;border-radius:50%;object-fit:cover}

.embedprev .ti{grid-column:1;font-weight:700;font-size:15px}.embedprev .ds{grid-column:1;font-size:13px;color:#b5bac1}

.picrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.picrow img{max-height:56px;max-width:140px;border-radius:6px;background:#0a0b0f;border:1px solid var(--line)}

</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ""); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
let S = { tab: "dashboard", hello: null, state: null, config: null, authed: false, logsTimer: null };
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", "X-Requested-With": "gtv-admin" }, body: body === undefined ? undefined : JSON.stringify(body), credentials: "same-origin" });
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== "/api/login") { S.authed = false; render(); }
  if (!r.ok || j.ok === false) { const err = new Error(j.error || ("HTTP " + r.status)); err.data = j; throw err; }
  return j;
}
function toast(msg, kind) { const t = h("div", { class: "toast " + (kind || "") }, msg); $("#toast").append(t); setTimeout(() => t.remove(), kind === "bad" ? 9000 : 4000); }
async function act(btn, fn) { if (btn) btn.disabled = true; try { return await fn(); } catch (e) { toast(e.message, "bad"); } finally { if (btn) btn.disabled = false; } }
async function refresh() { try { S.state = await api("GET", "/api/state"); S.config = (await api("GET", "/api/config")).config; } catch (e) {} }
const field = (label, input, hint) => h("div", { class: "f" }, h("label", {}, label), input, hint ? h("div", { class: "hint" }, hint) : null);
const text = (v, o) => h("input", Object.assign({ type: "text", value: v == null ? "" : v }, o || {}));
const num = (v, o) => h("input", Object.assign({ type: "number", value: v }, o || {}));
const check = (v, label) => h("label", { style: "display:flex;align-items:center;color:var(--text);font-size:14px" }, h("input", { type: "checkbox", checked: !!v }), label);

function renderChecks(box, res) {
  box.replaceChildren(...res.checks.map(c => h("div", { class: "check" }, h("b", {}, c.label), h("span", { class: "st " + c.status }, c.status === "problem" ? "PROBLEM" : c.status === "ok" ? "ok" : "info"),
    h("div", {}, h("pre", {}, c.msg), c.fix ? h("div", { class: "fix" }, "→ " + c.fix) : null))));
  box.prepend(h("div", { class: "pill " + (res.problems ? "bad" : "ok"), style: "display:inline-block;margin-bottom:8px" }, res.problems ? res.problems + " problem(s)" : "all good"));
}

// ---------------------------------------------------------------- shell
async function boot() {
  try { S.hello = await api("GET", "/api/hello"); } catch (e) { S.hello = { configured: true }; }
  try { await refresh(); S.authed = !!S.state; } catch (e) {}
  render();
  setInterval(async () => { if (S.authed) { try { S.state = await api("GET", "/api/state"); renderHeader(); if (S.tab === "dashboard") renderTab(); } catch (e) {} } }, 5000);
}
function render() {
  const root = $("#app"); root.replaceChildren();
  if (!S.authed) return root.append(loginView());
  root.append(h("header", { id: "hd" }), h("nav", { id: "nav" }), h("main", { id: "main" }));
  renderHeader(); renderNav(); renderTab();
}
function renderHeader() {
  const hd = $("#hd"); if (!hd || !S.state) return;
  const d = S.state.runtime.discord, ds = d.state;
  hd.replaceChildren(...[h("h1", {}, "The Forge GTV · Admin"), h("span", { class: "muted" }, "v" + S.state.version + " · " + S.state.owner),
    h("span", { class: "sp" }),
    S.state.runtime.needs_restart ? h("span", { class: "pill warn" }, "restart needed") : null,
    h("span", { class: "pill " + (ds === "Ready" && !S.state.runtime.discord_note ? "ok" : ds === "Failed" ? "bad" : "warn"), title: ds === "Failed" ? d.detail : (S.state.runtime.discord_note || "") }, "Discord: " + (ds === "Ready" ? d.detail : ds === "NoToken" ? "no token" : ds === "Failed" ? "failed" : ds.toLowerCase())),
    h("button", { class: "b sec", onclick: async () => { await api("POST", "/api/logout"); S.authed = false; render(); } }, "Sign out")].filter(Boolean));
}
function renderNav() {
  const tabs = [["dashboard", "Dashboard"], ["setup", "Setup"], ["servers", "Servers"], ["video", "Video"], ["branding", "Branding"], ["settings", "Settings"], ["logs", "Logs"]];
  $("#nav").replaceChildren(...tabs.map(([id, t]) => h("button", { class: S.tab === id ? "on" : "", onclick: () => { S.tab = id; renderNav(); renderTab(); } }, t)));
}
function renderTab() {
  clearInterval(S.logsTimer);
  const m = $("#main"); if (!m) return; m.replaceChildren();
  ({ dashboard: viewDashboard, setup: viewSetup, servers: viewServers, video: viewVideo, branding: viewBranding, settings: viewSettings, logs: viewLogs })[S.tab](m);
}
function loginView() {
  const first = S.hello && !S.hello.configured;
  const pw = h("input", { type: "password", placeholder: first ? "Choose a password (8+ characters)" : "Admin password", autofocus: true });
  const go = async (btn) => act(btn, async () => { await api("POST", first ? "/api/setup" : "/api/login", { password: pw.value }); await refresh(); S.authed = true; render(); });
  pw.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  return h("div", { class: "login card" }, h("h2", {}, first ? "Welcome — set an admin password" : "The Forge GTV · Admin"),
    first ? h("p", { class: "muted" }, "This is the first start. Choose a password for this panel. You can only do this from the computer the bot runs on.") : null,
    field(first ? "New password" : "Password", pw), h("button", { class: "b", onclick: e => go(e.target) }, first ? "Set password" : "Sign in"),
    h("div", { class: "hint", style: "margin-top:12px" }, "The Forge GTV v" + (S.hello ? S.hello.version : "") + " · owner " + (S.hello ? S.hello.owner : "")),
    h("div", { class: "hint" }, "Free software under the GNU GPL v3 or later · no warranty · not affiliated with Frozen Sand, Urban Terror or Discord Inc."));
}

// ---------------------------------------------------------------- dashboard
/** Why Discord is not (fully) working, in words: the failure the bot got, or a note about a feature that had to be switched off. */
function discordBanner() {
  const d = S.state.runtime.discord, note = S.state.runtime.discord_note;
  const kids = [];
  if (d.state === "Failed") kids.push(h("div", { class: "fix" }, "✘ Discord: " + d.detail), h("div", { class: "muted" }, "Fix it, then press “Reconnect to Discord” on the Setup tab."));
  if (note) kids.push(h("div", { class: "warnbox" }, note));
  return kids.length ? h("div", { class: "card" }, ...kids) : null;
}
function viewDashboard(m) {
  const st = S.state, rt = st.runtime;
  const db = discordBanner(); if (db) m.append(db);
  m.append(h("div", { class: "card" }, h("h2", {}, "Getting started"), h("ul", { class: "steps" }, ...st.checklist.map(c =>
    h("li", {}, h("span", { class: "dot " + (c.done ? "done" : "") }), c.title, c.manual ? h("span", { class: "muted" }, " (use the link on the Setup tab)") : null)))));
  if (st.problems.length) m.append(h("div", { class: "card" }, h("h2", {}, "Configuration problems"), h("ul", {}, ...st.problems.map(p => h("li", {}, p)))));
  m.append(h("div", { class: "card" }, h("h2", {}, "Running broadcasts" + (rt.watches.length > 1 ? " (" + rt.watches.length + ")" : "")), rt.watches.length ? h("table", {}, h("tr", {}, h("th", {}, "Channel"), h("th", {}, "Server"), h("th", {}, "Delay"), h("th", {}, "Video"), h("th", {}, "Player port"), h("th", {}, "Watching"), h("th", {})),
    ...rt.watches.map(w => h("tr", {}, h("td", { class: "mono" }, w.channel_id), h("td", {}, w.server), h("td", {}, w.delay + "s"), h("td", {}, w.video ? "on" : "off"), h("td", { class: "mono" }, w.video ? (w.web_port ? String(w.web_port) : "shared") : "–"), h("td", {}, w.video ? "👁 " + w.viewers + (w.viewers_open > w.viewers ? " (+" + (w.viewers_open - w.viewers) + " waiting)" : "") : "–"),
      h("td", {}, h("button", { class: "b red", onclick: e => act(e.target, async () => { await api("POST", "/api/broadcast/stop", { channel_id: w.channel_id, server: w.server }); toast("Stopped", "ok"); await refresh(); renderTab(); }) }, "Stop"))))) :
    h("p", { class: "muted" }, "Nothing is broadcasting. Start one from Discord with /gtv start, or below. Any number of servers can broadcast at the same time — even in the same channel.")));
  m.append(startCard());
  m.append(h("div", { class: "card" }, h("h2", {}, "Servers"), st.servers.length ? h("table", {}, h("tr", {}, h("th", {}, "Key"), h("th", {}, "Name"), h("th", {}, "Address"), h("th", {}, "Live feed"), h("th", {}, "Video"), h("th", {}, "Player port"), h("th", {})),
    ...st.servers.map(s => { const out = h("div"); return h("tr", {}, h("td", { class: "mono" }, s.key), h("td", {}, s.name), h("td", { class: "mono" }, s.host + ":" + s.port), h("td", {}, s.log ? "games.log" : "scoreboard only"), h("td", {}, s.video ? "yes" : "no"), h("td", { class: "mono" }, s.video ? (s.web_port ? String(s.web_port) : "shared") : "–"),
      h("td", {}, h("button", { class: "b sec", onclick: e => act(e.target, async () => { const r = await api("POST", "/api/servers/" + s.key + "/test", {}); const box = h("div"); renderChecks(box, r); e.target.closest("td").append(box); }) }, "Test connection"))); })) :
    h("p", { class: "muted" }, "No servers yet — add one on the Servers tab.")));
}
function startCard() {
  const cfg = S.config, keys = Object.keys(cfg.servers);
  if (!keys.length) return h("div");
  const sel = h("select", {}, ...keys.map(k => h("option", { value: k }, k + " — " + (cfg.servers[k].name || k))));
  const ch = text("", { placeholder: "e.g. 123456789012345678" }), delay = num(0, { min: 0, max: 180 }), vid = h("input", { type: "checkbox" });
  return h("div", { class: "card" }, h("h2", {}, "Start a broadcast from here"),
    h("div", { class: "row" }, field("Server", sel), field("Discord channel ID", ch, "Right-click the channel → Copy Channel ID (Developer Mode must be on)"), field("Delay (s)", delay)),
    h("label", { style: "display:flex;align-items:center;margin-bottom:10px" }, vid, "Also start the spectator video"),
    h("div", { class: "hint" }, "Starting another server does not stop the ones already running — use a different channel, or the same one (each server gets its own scoreboard and feed)."),
    h("button", { class: "b", onclick: e => act(e.target, async () => { const r = await api("POST", "/api/broadcast/start", { channel_id: ch.value, server: sel.value, delay: +delay.value, stream: vid.checked }); toast(r.message, "ok"); await refresh(); renderTab(); }) }, "Start"));
}

// ---------------------------------------------------------------- setup wizard
function viewSetup(m) {
  const cfg = S.config;
  const sb = discordBanner(); if (sb) m.append(sb);
  const tok = text("", { type: "password", placeholder: cfg.discord.token ? "(saved — leave as is to keep)" : "Paste the bot token", autocomplete: "off" });
  if (cfg.discord.token) tok.value = cfg.discord.token;
  const info = h("div", { class: "hint" });
  const verify = async (btn) => act(btn, async () => {
    const r = await api("POST", "/api/discord/info", { token: tok.value });
    info.replaceChildren(r.valid ? h("span", {}, "✔ Token belongs to ", h("b", {}, r.name), " — ", h("a", { href: r.invite_url, target: "_blank", rel: "noopener" }, "Invite it to your Discord server")) : h("span", { class: "fix" }, "✘ " + r.error));
    return r;
  });
  m.append(h("div", { class: "card" }, h("h2", {}, "1 · Discord bot"),
    h("p", { class: "muted" }, "Create the bot at ", h("a", { href: "https://discord.com/developers/applications", target: "_blank", rel: "noopener" }, "discord.com/developers/applications"), " → New Application → Bot → Reset Token, then paste the token here."),
    field("Bot token", tok), info,
    h("div", { class: "acts" },
      h("button", { class: "b sec", onclick: e => verify(e.target) }, "Check token"),
      h("button", { class: "b", onclick: e => act(e.target, async () => {
        const r = await verify(); if (!r.valid) return;
        const c = JSON.parse(JSON.stringify(S.config)); c.discord.token = tok.value;
        await api("PUT", "/api/config", { config: c }); await api("POST", "/api/discord/reconnect"); toast("Saved — connecting to Discord…", "ok"); await refresh(); renderHeader();
      }) }, "Save & connect"))));
  m.append(h("div", { class: "card" }, h("h2", {}, "2 · Your game server"), h("p", { class: "muted" }, Object.keys(cfg.servers).length ? "You have " + Object.keys(cfg.servers).length + " server(s). Add more or edit them on the Servers tab." : "No server yet."),
    h("button", { class: "b", onclick: () => { S.tab = "servers"; S.edit = { key: "", isNew: true }; renderNav(); renderTab(); } }, "Add a server")));
  const pub = text(cfg.web ? cfg.web.public_url : "", { placeholder: "http://your-public-address:8080" });
  m.append(h("div", { class: "card" }, h("h2", {}, "3 · Video player address (optional)"), h("p", { class: "muted" }, "Only needed for the spectator video. This is the address viewers open — it must be reachable from the internet (open the port on your firewall/router)."),
    field("Public URL", pub), h("button", { class: "b", onclick: e => act(e.target, async () => {
      const c = JSON.parse(JSON.stringify(S.config)); c.web = c.web || { host: "0.0.0.0", port: 8080, public_url: "", token: "" };
      c.web.public_url = pub.value.trim(); if (!c.web.token || c.web.token === "") c.web.token = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("");
      const r = await api("PUT", "/api/config", { config: c }); toast(r.needs_restart ? "Saved — restart the bot to open the web port" : "Saved", "ok"); await refresh(); renderHeader();
    }) }, "Save")));
  m.append(h("div", { class: "card" }, h("h2", {}, "4 · Use it in Discord"), h("p", {}, "In the channel where you want the live scoreboard, type ", h("code", {}, "/gtv start"), " and pick your server. Add ", h("code", {}, "stream:True"), " for video. Or start one from the Dashboard.")));
}

// ---------------------------------------------------------------- servers
function viewServers(m) {
  const cfg = S.config;
  if (S.edit) return m.append(serverForm(S.edit));
  m.append(h("div", { class: "card" }, h("div", { class: "acts", style: "justify-content:space-between;margin-bottom:8px" }, h("h2", {}, "Game servers"),
    h("button", { class: "b", onclick: () => { S.edit = { key: "", isNew: true }; renderTab(); } }, "+ Add server")),
    Object.keys(cfg.servers).length ? h("table", {}, h("tr", {}, h("th", {}, "Key"), h("th", {}, "Name"), h("th", {}, "Address"), h("th", {}, "games.log"), h("th", {})),
      ...Object.entries(cfg.servers).map(([k, s]) => h("tr", {}, h("td", { class: "mono" }, k), h("td", {}, s.name || k), h("td", { class: "mono" }, s.host + ":" + s.port), h("td", { class: "mono" }, s.log_path || "—"),
        h("td", { class: "acts" }, h("button", { class: "b sec", onclick: () => { S.edit = { key: k, isNew: false }; renderTab(); } }, "Edit"),
          h("button", { class: "b red", onclick: e => { if (confirm("Remove server '" + k + "'?")) act(e.target, async () => { await api("DELETE", "/api/servers/" + k); await refresh(); toast("Removed", "ok"); renderTab(); }); } }, "Remove"))))) :
      h("p", { class: "muted" }, "No servers yet. You can watch several game servers with one bot — add each one here.")));
  m.append(sftpCard());
}
function sshFields(init) {
  const f = { name: text(init.name || "", { placeholder: "e.g. gameserver" }), host: text(init.host || ""), port: num(init.port || 22), user: text(init.user || ""),
    password: text("", { type: "password", placeholder: "or use a key file" }), key_file: text(init.key_file || "", { placeholder: "~/.ssh/id_ed25519" }) };
  const box = h("div", {}, h("div", { class: "row" }, field("Connection name", f.name, "A label for this login, e.g. gameserver"), field("Host", f.host), field("Port", f.port), field("User", f.user)),
    h("div", { class: "row" }, field("Password", f.password), field("or private key file (on this machine)", f.key_file)));
  const body = () => ({ type: "sftp", host: f.host.value.trim(), port: +f.port.value, user: f.user.value.trim(), password: f.password.value, key_file: f.key_file.value.trim(), known_hosts: "", password_env: "", trust_unknown_hosts: false });

    h("p", { class: "muted" }, "The scoreboard shows the level picture of the map being played, resized to one fixed square so every post looks the same however the map's own picture was made (and a channel with several broadcasts stays tidy). The bot reads it from the game files: the server's “UrT folder” of the spectator video, or a folder you give under Servers → edit → More options. It is shown a few seconds after a map starts, and nothing is shown for a map it has no picture for."),
    !b.public_address_set ? h("div", { class: "warnbox" }, "Discord fetches the picture from your web player, so the ", h("b", {}, "Public URL"), " (Settings tab) must be set.") : null,
    on, h("div", { class: "row" }, field("Size (pixels, width and height)", size, "128 – 640. 320 is a good size for a channel with several broadcasts; Discord may show it a little smaller."), field("Not a square picture?", fit)),
    h("button", { class: "b", onclick: e => act(e.target, async () => {
      const c = JSON.parse(JSON.stringify(S.config));
      c.levelshots = { enabled: on.querySelector("input").checked, size: Math.max(L.min, Math.min(L.max, +size.value || 320)), fit: fit.value };
      await api("PUT", "/api/config", { config: c }); await refresh(); toast("Saved", "ok"); renderTab();
    }) }, "Save"),
    keys.length ? h("div", { style: "margin-top:16px" }, h("h3", {}, "Test: does the bot find a picture?"), h("div", { class: "row" }, field("Server", sel), field("Map", map)),
      h("button", { class: "b sec", onclick: e => act(e.target, find) }, "Find the picture"), out) : null);
  return card;
}

// ---------------------------------------------------------------- who can open the panel
function accessCard() {
  const a = S.state.access;
  const cur = h("input", { type: "password", autocomplete: "current-password" }), nw = h("input", { type: "password", autocomplete: "new-password" });
  const ips = h("textarea", { style: "min-height:70px", placeholder: "one per line, e.g.\n203.0.113.7\n10.0.0.0/8" }, (a.allowed_ips || []).join("\n"));
  const list = () => ips.value.split(/[\n,;\s]+/).map(x => x.trim()).filter(Boolean);
  const ack = h("input", { type: "checkbox" });
  const send = async (remote, extra) => {
    const r = await api("POST", "/api/access", Object.assign({ remote, password: cur.value }, extra || {}));
    cur.value = ""; nw.value = ""; await refresh(); renderHeader(); renderTab();
    toast(r.needs_restart ? "Saved - restart the bot to apply (Settings → Restart the bot)" : "Saved", "ok");
  };
  const card = h("div", { class: "card" }, h("h2", {}, "Who can open this panel"),
    h("span", { class: "pill " + (a.remote ? "warn" : "ok") }, a.remote ? "Open to other computers" : "This computer only"));
  if (!a.remote) {
    card.append(h("p", { class: "muted" }, "Right now the panel only answers on the computer the bot runs on (" + a.host + ":" + a.port + "). That is the safest setting: to reach it from your own PC, use an SSH tunnel, or turn on remote access below."),
      h("details", {}, h("summary", {}, "Let other computers open the panel…"),
        h("div", { class: "warnbox" }, "The panel can read and change your bot token, server passwords and SFTP logins. Only turn this on if you need it, and then protect it: allow only your own address below, and use a VPN, an SSH tunnel or an HTTPS reverse proxy - the panel itself speaks plain HTTP, so on the open internet your password could be read. A firewall rule for port " + a.port + " is a good extra step."),
        h("div", { class: "row" }, field("Your current password", cur), field("New password for remote access (" + a.min_password + "+ characters)", nw, "A long phrase of random words is best. Your old password stops working.")),
        field("Only these addresses may open it (optional, but recommended)", ips, "A single address (203.0.113.7) or a range (10.0.0.0/8). This computer is always allowed. Leave empty to allow any address that knows the password."),
        h("label", { style: "display:flex;align-items:center;margin-bottom:10px" }, ack, "I understand the panel uses plain HTTP and I will protect it (VPN, tunnel, proxy or firewall)."),
        h("button", { class: "b", onclick: e => { if (!ack.checked) return toast("Tick the box to confirm.", "bad"); act(e.target, () => send(true, { new_password: nw.value, allowed_ips: list() })); } }, "Allow remote access")));
  } else {
    card.append(h("p", { class: "muted" }, "Other computers can open the panel at http://<this computer>:" + a.port + (a.allowed_ips.length ? ", but only from: " + a.allowed_ips.join(", ") + "." : ", from any address that knows the password.") + " It uses plain HTTP: keep it behind a VPN, an SSH tunnel or an HTTPS proxy."),
      field("Only these addresses may open it", ips, "One per line. Empty = any address. This computer is always allowed. If you list addresses, include the one you are using now."),
      h("div", { class: "row" }, field("Your current password", cur), field("New password (optional, " + a.min_password + "+ characters)", nw)),
      h("div", { class: "acts" },
        h("button", { class: "b", onclick: e => act(e.target, () => send(true, { new_password: nw.value, allowed_ips: list() })) }, "Save"),
        h("button", { class: "b sec", onclick: e => { if (confirm("Close the panel to other computers? You will need to be on the bot's computer (or use an SSH tunnel) to open it.")) act(e.target, () => send(false)); } }, "Back to this computer only")));
  }
  card.append(h("div", { class: "hint", style: "margin-top:8px" }, "From the command line on the bot's computer: forge-gtv admin-access show | local | remote --allow <address>. Changing between local and remote takes effect after a restart; closing it to other computers is immediate."));
  return card;
}

// ---------------------------------------------------------------- logs
function viewLogs(m) {
  const pre = h("pre", { class: "log" }); m.append(h("div", { class: "card" }, h("h2", {}, "Bot log (live)"), pre));
  const load = async () => { try { const r = await api("GET", "/api/logs?n=400"); const atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 30; pre.textContent = r.lines.join("\n"); if (atEnd) pre.scrollTop = pre.scrollHeight; } catch (e) {} };
  load().then(() => pre.scrollTop = pre.scrollHeight); S.logsTimer = setInterval(load, 3000);
}
boot();
</script></body></html>
